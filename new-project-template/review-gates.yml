id: "review-gates"
extends: "speckit"
priority: 10
enabled: true
edits:
  - insert_after: specify
    step:
      id: review-coverage
      type: gate
      message: "Verify the spec's Requirements Coverage section: roadmap entry cited; Completes/Advances RQ IDs match the ROADMAP.md row; every FR maps to >=1 RQ ID; no Advances-only RQ is recorded as Completes. Run /speckit-requirements-verify and confirm every Completes RQ has distinctive content in the spec, not just its ID in the trace table (a claimed-but-untranscribed requirement is drift), and a recorded requirement digest matching the requirement's current wording (a stale digest means the wording changed after the spec recorded it)."
      options: [approve, reject]
      on_reject: abort

  - insert_after: plan
    step:
      id: review-plan-checklist
      type: gate
      message: "Apply the plan-checklist check (/speckit-requirements-plan-checklist): escape hatches need requirement authority (every design opt-out for a MUST-gated behaviour names who may use it and cites the authorizing requirement wording), every threshold-shaped term in a Completes-claimed FR carries an operational formula and default in the design documents, every MUST the plan relies on has a task that builds it, and boundaries are specified - every raise names the handler that catches it, every fail-closed behavior names its positive-path test, every parser delta over an external wire format names its fixture evidence and blocks on live validation when the format is offline-unverifiable, every new command surface names a test on its real invocation path (the default or primary route a user takes), not only a flagged or synthetic variant, and every new validator names its schema-valid-but-malformed input cases. The checklist lives in the extension command; reject until it passes."
      options: [approve, reject]
      on_reject: abort

  - insert_after: tasks
    step:
      id: review-tasks
      type: gate
      message: "Review generated tasks against the constitution, REQUIREMENTS.md, and the feature specification, applying the tasks-checklist check (/speckit-requirements-tasks-checklist): tasks extending an enum, register, or valid-values set are grounded in the current values from source and update every artifact an existing enumerating checker tracks, task IDs are sequential in execution order, tests-first with known-good and known-bad fixtures, and the boundary rules hold - a task that adds a raise names the handler that catches it and drives the exception through that handler, every new command surface carries a test on its real invocation path (the default or primary route), not only a flagged or synthetic variant, fail-closed parses and probes carry positive-path fixture tests (a parser of an external service's response blocks on live validation when the wire format cannot be verified offline), validator test matrices include schema-valid-but-malformed inputs, and one-to-N refactors carry per-entity and partial-failure tests, and semantic checks enumerate every violation class, and failure boundaries enumerate their wrapped calls' failure classes. The checklist lives in the extension command; reject until it passes."
      options: [approve, reject]
      on_reject: abort

  - insert_after: tasks
    step:
      id: review-implement-checklist
      type: gate
      message: "Review the implementation ahead against the constitution, REQUIREMENTS.md, the feature specification, and the tasks-checklist check (/speckit-requirements-tasks-checklist): the rules hold against the code and tests being written, not only the task text - tasks extending an enum, register, or valid-values set are grounded in the current values from source and update every artifact an existing enumerating checker tracks, task IDs are sequential in execution order, tests-first with known-good and known-bad fixtures, and the boundary rules hold - a task that adds a raise names the handler that catches it and drives the exception through that handler, every new command surface carries a test on its real invocation path (the default or primary route), not only a flagged or synthetic variant, fail-closed parses and probes carry positive-path fixture tests (a parser of an external service's response blocks on live validation when the wire format cannot be verified offline), validator test matrices include schema-valid-but-malformed inputs, and one-to-N refactors carry per-entity and partial-failure tests, and semantic checks enumerate every violation class, and failure boundaries enumerate their wrapped calls' failure classes. The checklist lives in the extension command; reject until it passes."
      options: [approve, reject]
      on_reject: abort

  - insert_after: implement
    step:
      id: review-diff
      type: gate
      message: "Confirm the implementation diff received an independent review (/speckit-requirements-diff-review): a fresh context - subagent or new session - was given only the goal, the applicable checklists, and the diff, derived its own falsification probes, and reported no open violations; every finding was fixed and the review re-run clean, never rationalized away. The procedure lives in the extension command; reject until it passes."
      options: [approve, reject]
      on_reject: abort

  - insert_after: implement
    step:
      id: review-final-tree
      type: gate
      message: "Review the final working tree against the constitution, REQUIREMENTS.md, and feature acceptance criteria, confirming that each Completed RQ ID has realizing implementation, that baseline-completed invariants remain satisfied, and that no Advances-only RQ is claimed complete. If findings are fixed, rerun this gate against the corrected tree."
      options: [approve, reject]
      on_reject: abort
