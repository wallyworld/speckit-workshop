name: speckit-ws
base: ubuntu@24.04
sdks:
  - name: agy
  - name: copilot
  - name: gh-cli
  - name: opencode
  - name: project-dev-tools
  - name: uv

actions:
  opencode: |
    set -euo pipefail
    cd /project/petstore
    opencode "$@"

  copilot: |
    set -euo pipefail
    cd /project/petstore
    copilot "$@"

  agy: |
    set -euo pipefail
    cd /project/petstore
    agy --mode accept-edits --dangerously-skip-permissions --model gemini-3.8-flash-high "$@"

  install-browser: |
    set -euo pipefail
    /project/scripts/install-browser.sh